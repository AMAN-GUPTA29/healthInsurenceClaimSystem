version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claims-backend
    ports:
      - "8000:8000"
    volumes:
      # Persist database across restarts
      - ./data:/app/data
      # Mount assignment files for live policy updates
      - ./policy_terms.json:/app/policy_terms.json:ro
      - ./test_cases.json:/app/test_cases.json:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/claims.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Frontend (Phase 0: Build + serve) ─────────────────────────────────────
  # Uncomment when Node.js is available for frontend build
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile.frontend
  #   container_name: claims-frontend
  #   ports:
  #     - "5173:80"
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   environment:
  #     - VITE_API_BASE_URL=http://backend:8000

volumes:
  claims_data:
